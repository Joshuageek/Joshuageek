    <style>
      body {
        font-family: "Montserrat", sans-serif;
      }

      .form-container {
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      .form-container h2 {
        margin-bottom: 20px;
        font-size: 24px;
        color: #333;
      }

      .form-container .form-group {
        margin-bottom: 15px;
      }

      .form-container .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #555;
      }

      .form-container .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }

      .form-container .form-group input[type="submit"] {
        background-color: #f8bf2c;
        color: #fff;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .form-container .form-group input[type="submit"]:hover {
        background-color: #e0ac2b;
      }

      .form-container .form-group .login-link {
        display: block;
        margin-top: 20px;
        color: #555;
        text-decoration: none;
      }

      .form-container .form-group .login-link:hover {
        color: #f8bf2c;
        text-decoration: underline;
      }
    </style>

    <!--begin signup-section -->
    <section class="signup-section">
      <div class="form-container">
        <h2>Sign Up</h2>
        <form action="#" method="post">
          <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required />
          </div>
          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required />
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password:</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              required
            />
          </div>
          <div class="form-group">
            <input type="submit" value="Sign Up" />
          </div>
          <div class="form-group">
            <a href="login.html" class="login-link"
              >Already have an account? Login</a
            >
          </div>
        </form>
      </div>
    </section>
    <!--end signup-section -->
